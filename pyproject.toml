[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-refusal-interpretability"
version = "0.1.0"
description = "Mechanistic interpretability pipeline for safety-relevant directions and refusal behavior in open LLMs"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "huggingface-hub>=0.27,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "peft>=0.14,<1",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.5",
  "tqdm>=4.66,<5",
  "transformers>=4.48,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
